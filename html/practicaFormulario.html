<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Page</title>
    <link rel="stylesheet" href="../css/formularioPractica.css">
    <script src="../js/formularioPractica.js"></script>
</head>

<body>

    <div class="container">

        <div class="card">
            <img src="../img/tarjeta.png" alt="Tarjeta de crédito">
        </div>

        <form id="paymentForm" class="form">
            <h2>Payment Details</h2>
            <p id="id-msg-error" class="msg-error"></p>

            <div class="detalles">
                <label for="cardholder">Cardholder Name</label>
                <input type="text" id="cardholder" placeholder="Mrs Kate Smith" required>
                <span id="id_error_cardholder" class="error_asterisco"></span>
            </div>
            <div class="detalles">

                <label for="cardnumber">Card Number</label>
                <input type="text" id="cardnumber" maxlength="19" placeholder="0000 0000 0000 0000" required>
                <span id="id_error_cardnumber" class="error_asterisco"></span>
            </div>
            <div class="datos">
                <div class="detalles">

                    <label for="exp">Exp Date</label>
                    <input type="text" id="exp" placeholder="MM/YY" maxlength="5" pattern="(0[1-9]|1[0-2])\/\d{2}"
                        required>
                    <span id="id_error_exp" class="error_asterisco"></span>
                </div>

                <div class="detalles">
                    <label for="cvv">CVV</label>
                    <input type="password" id="cvv" maxlength="3" placeholder="000" required>
                    <span id="id_error_cvv" class="error_asterisco"></span>
                </div>
            </div>

            <button type="submit">Confirm</button>
        </form>

    </div>

</body>

</html>
