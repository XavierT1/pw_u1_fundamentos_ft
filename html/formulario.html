<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/formulario.css">
    <script src="../js/formulario.js"></script>
</head>

<body>
    <div class="container">
        <header>Universidad Central del Ecuador </header>
        <div class="formulario">
            <nav></nav>
            <section>
                <form action="#">
                    <div class="title">
                        <h2>Nuevo Estudiante</h2>

                    </div>

                    <div class="msg-error" id="id-msg-error"></div>

                    <p type="Nombre: ">
                        <input type="text" id="nombre">
                        <span id="id-error-nombre" class="error_asterisco"></span>
                    </p>

                    <p type="Apellido: ">
                        <input type="text" id="apellido">
                        <span id="id-error-apellido" class="error_asterisco"></span>
                    </p>

                    <p type="Fecha de Nacimiento: ">
                        <input type="date" id="fecha">
                        <span id="id-error-fecha" class="error_asterisco"></span>
                    </p>

                    <p type="Email: ">
                        <input type="email" id="email">
                        <span id="id-error-email" class="error_asterisco"></span>
                    </p>

                    <p type="Contraseña: ">
                        <input type="password" id="password">
                        <span id="id-error-password" class="error_asterisco"></span>
                    </p>


                    <div class="btn">
                        <button onclick="guardar()">Guardar</button>

                    </div>
                </form>
            </section>
        </div>
        <footer>Todos los derechos reservados</footer>
    </div>
</body>

</html>
