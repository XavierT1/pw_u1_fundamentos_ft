<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../css/formulario.css">
    <script src="../js/formulario.js"></script>
</head>

<body>
    <div class="container">
        <header>Universidad Central del Ecuador </header>
        <div class="formulario">
            <nav></nav>
            <section>
                <form action="#">
                    <div class="title">
                        <h2>Nuevo Estudiante</h2>
 
                    </div>
 
                    <div class="msg-error" id="id-msg-error"></div>
 
                    <p type="Nombre: "><input type="text" id="nombre">
                        <span id="id-error-nombre" class="error-asterisco"></span>
                    </p>
                    <p type="Apellido: "><input type="text" id="apellido"></p>
                    <p type="Fecha de Nacimiento: "><input type="date" id="fecha"></p>
                    <p type="Email: "><input type="email" id="email"></p>
                    <p type="Contraseña: "><input type="password" id="password"></p>
 
                    <div class="btn">
                        <button onclick="guardar()">Guardar</button>
 
                    </div>
                </form>
            </section>
        </div>
        <footer>Todos los derechos reservados</footer>
    </div>
</body>

</html>
